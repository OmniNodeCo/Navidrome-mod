name: Build and publish four-target prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching build.gradle (for example v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: navidrome-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build all four targets
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish verified JARs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: navidrome-*
          path: release-assets
          merge-multiple: true
      - name: Verify version and all four distributables
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          version=$(sed -n "s/^[[:space:]]*version = '\([^']*\)'.*/\1/p" build.gradle)
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG must match build.gradle version $version"; exit 1; }
          targets=(fabric-26.2 fabric-26.3 neoforge-26.2 neoforge-26.3)
          for target in "${targets[@]}"; do
            jar_path="release-assets/navidrome-$target-$version.jar"
            test -s "$jar_path" || { echo "Missing or empty JAR: $jar_path"; exit 1; }
          done
          shopt -s nullglob
          jars=(release-assets/*.jar)
          [[ "${#jars[@]}" -eq 4 ]] || { echo "Expected exactly four installable JARs, found ${#jars[@]}"; exit 1; }
          (cd release-assets && sha256sum ./*.jar > SHA256SUMS && cat SHA256SUMS)
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/*.jar release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Navidrome Minecraft client $RELEASE_TAG" \
            --prerelease \
            --notes 'Client-side preview for Fabric and NeoForge on Minecraft 26.2 and 26.3. CI builds and protocol tests passed; in-game functionality and full Navidrome feature parity have not been verified. Install only the JAR for your Minecraft version and loader.'
